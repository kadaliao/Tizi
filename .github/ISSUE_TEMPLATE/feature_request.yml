name: 功能建议
description: 新功能或改进建议
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 现在哪里不方便，或者缺什么
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的做法
      description: 你希望它怎么工作
  - type: textarea
    id: alternatives
    attributes:
      label: 其他方案
      description: 考虑过的替代办法，或者现在是怎么绕过的
